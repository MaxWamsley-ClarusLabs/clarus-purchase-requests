<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Purchase Requests (prototype preview)</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        background: #130d1c;
      }
      .preview-bar {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 100;
        display: flex;
        gap: 6px;
        align-items: center;
        background: rgba(19, 13, 28, 0.92);
        color: #fff;
        font:
          12px/1.3 Inter,
          'Segoe UI',
          Arial,
          sans-serif;
        padding: 6px 10px;
        border-radius: 999px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3);
      }
      .preview-bar button {
        font: inherit;
        border: 0;
        border-radius: 999px;
        padding: 4px 9px;
        cursor: pointer;
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
      }
      .preview-bar button.on {
        background: #c9a3e6;
        color: #24142f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
